namespace: boutique-app

global:
  accountId: "803146828684"
  region: "ap-south-1"

# Default configurations for all services
defaults:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001

services:

  frontend:
    port: 8080
    servicePort: 80
    replicas: 2
    imageTag: "v1"
    # HTTP service — uses default httpGet probe

  adservice:
    port: 9555
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:9555"]
      initialDelaySeconds: 20
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:9555"]
      initialDelaySeconds: 15
      periodSeconds: 10

  cartservice:
    port: 7070
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7070"]
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7070"]
      initialDelaySeconds: 5
      periodSeconds: 10

  checkoutservice:
    port: 5050
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:5050"]
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:5050"]
      initialDelaySeconds: 5
      periodSeconds: 10

  currencyservice:
    port: 7000
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7000"]
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7000"]
      initialDelaySeconds: 5
      periodSeconds: 10

  emailservice:
    port: 8080
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:8080"]
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:8080"]
      initialDelaySeconds: 5
      periodSeconds: 10

  paymentservice:
    port: 50051
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:50051"]
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:50051"]
      initialDelaySeconds: 5
      periodSeconds: 10

  productcatalogservice:
    port: 3550
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:3550"]
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:3550"]
      initialDelaySeconds: 5
      periodSeconds: 10

  recommendationservice:
    port: 8080
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:8080"]
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:8080"]
      initialDelaySeconds: 5
      periodSeconds: 10

  shippingservice:
    port: 50051
    replicas: 1
    imageTag: "v1"
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:50051"]
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:50051"]
      initialDelaySeconds: 5
      periodSeconds: 10

  shoppingassistantservice:
    port: 8080
    replicas: 1
    imageTag: "v1"
    # HTTP service — uses default httpGet probe

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: "boutique.example.com"
  tls:
    enabled: true
    secretName: boutique-tls-secret

# HPA config — referenced by hpa.yaml template
hpa:
  frontend:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  checkoutservice:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  productcatalogservice:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  recommendationservice:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  cartservice:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  currencyservice:
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  shippingservice:
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  adservice:
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
