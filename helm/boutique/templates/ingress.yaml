apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: boutique-ingress
  namespace: {{ .Values.namespace }}

  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: frontend
            port:
              number: 80
