{{- $account := .Values.global.accountId -}}
{{- $region := .Values.global.region -}}

{{- range $name, $svc := .Values.services }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}

  selector:
    matchLabels:
      app: {{ $name }}

  template:
    metadata:
      labels:
        app: {{ $name }}

    spec:
      {{- $podSecurityContext := merge (default dict $.Values.defaults.podSecurityContext) (default dict $svc.podSecurityContext) }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      containers:
      - name: {{ $name }}
        {{- $containerSecurityContext := merge (default dict $.Values.defaults.securityContext) (default dict $svc.securityContext) }}
        {{- $containerResources := merge (default dict $.Values.defaults.resources) (default dict $svc.resources) }}
        securityContext:
          {{- toYaml $containerSecurityContext | nindent 10 }}
        resources:
          {{- toYaml $containerResources | nindent 10 }}

        {{- /* ---- Liveness Probe: exec (gRPC) OR httpGet ---- */}}
        {{- if $svc.livenessProbe }}
          {{- if $svc.livenessProbe.exec }}
        livenessProbe:
          exec:
            command:
            {{- range $svc.livenessProbe.exec.command }}
            - {{ . }}
            {{- end }}
          initialDelaySeconds: {{ default 15 $svc.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ default 20 $svc.livenessProbe.periodSeconds }}
          {{- else }}
        livenessProbe:
          httpGet:
            path: {{ default "/" $svc.livenessProbe.httpGet.path }}
            port: {{ $svc.port }}
          initialDelaySeconds: {{ default 15 $svc.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ default 20 $svc.livenessProbe.periodSeconds }}
          {{- end }}
        {{- else }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ $svc.port }}
          initialDelaySeconds: {{ $.Values.defaults.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ $.Values.defaults.livenessProbe.periodSeconds }}
        {{- end }}

        {{- /* ---- Readiness Probe: exec (gRPC) OR httpGet ---- */}}
        {{- if $svc.readinessProbe }}
          {{- if $svc.readinessProbe.exec }}
        readinessProbe:
          exec:
            command:
            {{- range $svc.readinessProbe.exec.command }}
            - {{ . }}
            {{- end }}
          initialDelaySeconds: {{ default 5 $svc.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ default 10 $svc.readinessProbe.periodSeconds }}
          {{- else }}
        readinessProbe:
          httpGet:
            path: {{ default "/" $svc.readinessProbe.httpGet.path }}
            port: {{ $svc.port }}
          initialDelaySeconds: {{ default 5 $svc.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ default 10 $svc.readinessProbe.periodSeconds }}
          {{- end }}
        {{- else }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ $svc.port }}
          initialDelaySeconds: {{ $.Values.defaults.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ $.Values.defaults.readinessProbe.periodSeconds }}
        {{- end }}

        {{- /* ---- Startup Probe: exec (gRPC) OR httpGet ---- */}}
        {{- if $svc.startupProbe }}
          {{- if $svc.startupProbe.exec }}
        startupProbe:
          exec:
            command:
            {{- range $svc.startupProbe.exec.command }}
            - {{ . }}
            {{- end }}
          failureThreshold: {{ default 30 $svc.startupProbe.failureThreshold }}
          periodSeconds: {{ default 10 $svc.startupProbe.periodSeconds }}
          {{- else }}
        startupProbe:
          httpGet:
            path: {{ default "/" $svc.startupProbe.httpGet.path }}
            port: {{ $svc.port }}
          failureThreshold: {{ default 30 $svc.startupProbe.failureThreshold }}
          periodSeconds: {{ default 10 $svc.startupProbe.periodSeconds }}
          {{- end }}
        {{- else if $.Values.defaults.startupProbe }}
        startupProbe:
          {{- if and $svc.livenessProbe $svc.livenessProbe.exec }}
          exec:
            command:
            {{- range $svc.livenessProbe.exec.command }}
            - {{ . }}
            {{- end }}
          {{- else }}
          httpGet:
            path: /
            port: {{ $svc.port }}
          {{- end }}
          failureThreshold: {{ $.Values.defaults.startupProbe.failureThreshold }}
          periodSeconds: {{ $.Values.defaults.startupProbe.periodSeconds }}
        {{- end }}

        image: {{ $account }}.dkr.ecr.{{ $region }}.amazonaws.com/microservices-demo/{{ $name }}:{{ $svc.imageTag }}

        imagePullPolicy: Always

        ports:
        - containerPort: {{ $svc.port }}

{{- if eq $name "frontend" }}
        env:
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
        - name: CURRENCY_SERVICE_ADDR
          value: "currencyservice:7000"
        - name: CART_SERVICE_ADDR
          value: "cartservice:7070"
        - name: RECOMMENDATION_SERVICE_ADDR
          value: "recommendationservice:8080"
        - name: CHECKOUT_SERVICE_ADDR
          value: "checkoutservice:5050"
        - name: SHIPPING_SERVICE_ADDR
          value: "shippingservice:50051"
        - name: AD_SERVICE_ADDR
          value: "adservice:9555"
        - name: SHOPPING_ASSISTANT_SERVICE_ADDR
          value: "shoppingassistantservice:8080"
{{- end }}

{{- if eq $name "checkoutservice" }}
        env:
        - name: SHIPPING_SERVICE_ADDR
          value: "shippingservice:50051"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
        - name: CART_SERVICE_ADDR
          value: "cartservice:7070"
        - name: CURRENCY_SERVICE_ADDR
          value: "currencyservice:7000"
        - name: EMAIL_SERVICE_ADDR
          value: "emailservice:8080"
        - name: PAYMENT_SERVICE_ADDR
          value: "paymentservice:50051"
{{- end }}

{{- if eq $name "recommendationservice" }}
        env:
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
{{- end }}

{{- if eq $name "cartservice" }}
        env:
        - name: REDIS_ADDR
          value: "redis-cart:6379"
{{- end }}

{{- end }}
