# ==============================================================================
# Network Policies for boutique-app Namespace
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# 1. Frontend: Allow Ingress from the Ingress Controller (Nginx) and Load Generator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
    # In production, restrict to ingress controller namespace/labels if possible.
    # Allowing all sources on port 8080 ensures compatibility with various ingress controller placements.
    from: []

---
# 2. Ad Service: Allow Ingress from Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adservice-network-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: adservice
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 9555

---
# 3. Cart Service: Allow Ingress from Frontend and Checkout Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cartservice-network-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: cartservice
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: checkoutservice
    ports:
    - protocol: TCP
      port: 7070

---
# 4. Checkout Service: Allow Ingress from Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkoutservice-network-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: checkoutservice
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 5050

---
# 5. Currency Service: Allow Ingress from Frontend and Checkout Service
