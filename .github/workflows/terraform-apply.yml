##############################################################
# terraform-apply.yml
#
# Triggered on: push to main (after PR merge) for terraform/**
# Purpose: Apply approved terraform plan to AWS
#
# Security:
#   - OIDC authentication — no static credentials
#   - Only runs on main branch — not on PRs
#   - Requires successful plan before apply
#   - State stored in S3 with DynamoDB locking
##############################################################

name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production   # GitHub Environment — enables manual approval gate
    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials via OIDC ─────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::803146828684:role/github-actions-dev
          role-session-name: github-actions-terraform-apply
          aws-region: ap-south-1

      # ── 3. Setup Terraform ────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # ── 4. Terraform Init ─────────────────────────────────
      - name: Terraform Init
        run: terraform init

      # ── 5. Terraform Validate ─────────────────────────────
      - name: Terraform Validate
        run: terraform validate -no-color

      # ── 6. Terraform Plan (pre-apply confirmation) ─────────
      - name: Terraform Plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan

      # ── 7. Terraform Apply ────────────────────────────────
      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            tfplan

      # ── 8. Capture Outputs ────────────────────────────────
      # Save cluster name and ECR URLs for downstream workflows
      - name: Capture Terraform Outputs
        run: |
          echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> $GITHUB_ENV
          echo "CONFIGURE_KUBECTL=$(terraform output -raw configure_kubectl)" >> $GITHUB_ENV

      # ── 9. Update kubeconfig ──────────────────────────────
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name ${{ env.CLUSTER_NAME }}

      # ── 10. Verify cluster is reachable ───────────────────
      - name: Verify EKS cluster
        run: |
          kubectl get nodes
          kubectl get namespaces

      # ── 11. Summary ───────────────────────────────────────
      - name: Write Job Summary
        run: |
          echo "## ✅ Terraform Apply Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** \`${{ env.CLUSTER_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`ap-south-1\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To connect to the cluster:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.CONFIGURE_KUBECTL }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
